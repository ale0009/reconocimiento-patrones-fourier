[project]
name = "fourier-patrones"
version = "0.1.0"
description = "Reconocimiento de patrones mediante descriptores de Fourier-Mellin"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pillow>=10",
  "matplotlib>=3.8",
  "scikit-image>=0.22",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourier_patrones"]

[tool.uv]
cache-dir = ".uv-cache"
